[package]
name = "starsector-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orgize = { version = "0.9", features = ["chrono", "indexmap"] }
ropey = "1.6"
starsector = { path = "..", features = ["headline-parser", "orgize-integration"] }

[[bin]]
name = "document_parse"
path = "fuzz_targets/document_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "single_headline"
path = "fuzz_targets/single_headline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timestamp_parse"
path = "fuzz_targets/timestamp_parse.rs"
test = false
doc = false
bench = false
